[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pride"
version = "0.4.2"
description = "Fun with pride flags."
authors = [{ name = "Aaron Martinez" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12.1"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["pride*"]

[tool.setuptools.package-data]
"pride.docs" = ["*"]

[project.scripts]
pza = "pride.__main__:main"
